name: gds

on:
  push:
    branches:
      - version1
      - version2
  workflow_dispatch:

jobs:
  gds:
    if: github.ref_name != 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky25b
        with:
          pdk: sky130A

      - name: Render SVG from GDS
        run: ./tt/tt_tool.py --create-svg

      - name: Upload SVG layout
        id: svg
        uses: actions/upload-artifact@v4
        with:
          name: gds_svg
          path: gds_render.svg
          if-no-files-found: error

      - name: Link SVG layout
        run: echo "[Download SVG layout](${{ steps.svg.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  precheck:
    needs: gds
    if: github.ref_name != 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky25b

  gl_test:
    needs: gds
    if: github.ref_name != 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky25b

  viewer:
    needs: gds
    if: github.ref_name != 'main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky25b
