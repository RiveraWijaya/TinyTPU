# Metadata for the comparison branch. Each implementation branch keeps its own
# Tiny Tapeout manifest.
comparison_version: 1

project:
  title: TinyTPU
  purpose: Compare the version1 and version2 TinyTPU implementations.

branches:
  - name: version1
    label: Version 1
    layout_url: https://riverawijaya.github.io/TinyTPU/version1/
  - name: version2
    label: Version 2
    layout_url: https://riverawijaya.github.io/TinyTPU/version2/

# Files that every implementation branch must contain.
required_paths:
  - info.yaml
  - docs/info.md
  - src/tt_um_4x4TPU.sv
  - test/Makefile
  - test/test.py

# Public interface values that must remain compatible across implementations.
compatible_fields:
  - project.top_module
  - project.clock_hz
  - project.tiles
  - pinout
